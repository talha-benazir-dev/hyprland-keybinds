# =============================================================================
#  hyprland.conf — minimal CachyOS / Hyprland config
#  Reconstructed from Omarchy's Lua defaults. No Omarchy modules are sourced.
# =============================================================================

# Keybindings live in their own file so they are easy to back up and diff.
source = ~/.config/hypr/bindings.conf

# -----------------------------------------------------------------------------
#  Monitors
#  Omarchy used: all outputs, preferred mode, auto position, scale 1 & GDK_SCALE=1
# -----------------------------------------------------------------------------
monitor = , preferred, auto, 1
env = GDK_SCALE, 1

# -----------------------------------------------------------------------------
#  Keyboard (from /etc/vconsole.conf: us, pc105+inet)
# -----------------------------------------------------------------------------
input {
    kb_layout = us
    kb_model = pc105+inet
    kb_options = terminate:ctrl_alt_bksp
}

# -----------------------------------------------------------------------------
#  Look and feel (from your personal looknfeel.lua)
#    rounding = 8, dim_inactive = true, dim_strength = 0.15
#    easeOutQuint window motion
# -----------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
}

decoration {
    rounding = 8
    dim_inactive = true
    dim_strength = 0.15
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    animation = windows,   1, 4.2, easeOutQuint
    animation = windowsIn, 1, 3.0, easeOutQuint, popin 75%
    animation = windowsOut,1, 2.7, easeOutQuint, popin 85%
    animation = fadeIn,    1, 2.2, easeOutQuint
}

# -----------------------------------------------------------------------------
#  Autostart
# -----------------------------------------------------------------------------
exec-once = mako
exec-once = waybar
exec-once = wl-paste --watch cliphist store

# -----------------------------------------------------------------------------
#  Optional: Omarchy-style per-monitor workspaces.
#  Replace DP-1 with your monitor name (`hyprctl monitors -j`).
# -----------------------------------------------------------------------------
# workspace = 1, monitor:DP-1
# workspace = 2, monitor:DP-1
# workspace = 3, monitor:DP-1
# workspace = 4, monitor:DP-1
# workspace = 5, monitor:DP-1
