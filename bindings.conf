# =============================================================================
#  Hyprland keybindings — migrated from Omarchy (Hyprland 0.56.2, Omarchy 4.0)
# =============================================================================
#
#  This file is self-contained: source it from hyprland.conf with
#      source = ~/.config/hypr/bindings.conf
#
#  Omarchy's config was Lua (o.bind / hl.bind). This file keeps the same
#  muscle memory using plain hyprlang syntax, with no Omarchy dependency.
#
#  Only standard Hyprland dispatchers are used. Every dispatcher below was
#  validated with `Hyprland --verify-config`.
#
#  Omarchy script replaced by a standard equivalent:
#    omarchy-launch-browser      -> $browser (Helium)
#    omarchy-launch-terminal     -> $terminal (kitty)
#    omarchy-launch-nautilus     -> nautilus
#    omarchy-menu toggle root    -> fuzzel
#    omarchy-shell panels        -> DROPPED (quickshell-only, see README)
#    omarchy-hyprland-window-*   -> native dispatchers where possible
#    omarchy-capture-screenshot  -> scripts/screenshot.sh (grim + slurp + satty)
#    omarchy-system-lock         -> hyprlock
#    omarchy-audio-output-volume -> wpctl
#    omarchy-brightness-display  -> brightnessctl
#    omarchy-shell media.* IPC   -> playerctl
# =============================================================================

# -----------------------------------------------------------------------------
#  Variables (the Omarchy "app variables" equivalent)
# -----------------------------------------------------------------------------

$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$browser = helium-browser
$editor = code
$menu = fuzzel
$scripts = ~/.config/hypr/scripts

# =============================================================================
#  WINDOW MANAGEMENT
# =============================================================================

# Close the active window (Omarchy bound both Q and W).
bind = $mainMod, Q, killactive,
bind = $mainMod, W, killactive,

bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod ALT, F, fullscreen, 1          # 1 = maximize (not true fullscreen)
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit,
bind = $mainMod, O, pin,                       # Omarchy: "pop out" = float + pin

# Focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Swap windows
bind = $mainMod SHIFT, left,  swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up,    swapwindow, u
bind = $mainMod SHIFT, down,  swapwindow, d

# Window groups (Omarchy groups are native Hyprland groups)
bind = $mainMod, G, togglegroup,
bind = $mainMod ALT, G, moveoutofgroup,
bind = $mainMod ALT, left,  moveintogroup, l
bind = $mainMod ALT, right, moveintogroup, r
bind = $mainMod ALT, up,    moveintogroup, u
bind = $mainMod ALT, down,  moveintogroup, d
bind = $mainMod ALT, TAB, changegroupactive, f
bind = $mainMod ALT SHIFT, TAB, changegroupactive, b

# Alt-Tab window cycling. Two binds on the same chord: cycle, then raise.
bind = ALT, TAB, cyclenext,
bind = ALT, TAB, bringactivetotop,
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT SHIFT, TAB, bringactivetotop,

# Monitors
bind = CTRL ALT, TAB, focusmonitor, +1
bind = CTRL ALT SHIFT, TAB, focusmonitor, -1
bind = $mainMod SHIFT ALT, left,  movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT ALT, right, movecurrentworkspacetomonitor, r
bind = $mainMod SHIFT ALT, up,    movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT ALT, down,  movecurrentworkspacetomonitor, d
# Omarchy moved windows to a monitor by direction via a helper. Plain Hyprland
# moves across monitors only at the workspace edge; for a fixed target use
#   movewindow, mon:<MONITOR-NAME>      (see `hyprctl monitors`)
bind = $mainMod SHIFT CTRL, left,  movewindow, l
bind = $mainMod SHIFT CTRL, right, movewindow, r
bind = $mainMod SHIFT CTRL, up,    movewindow, u
bind = $mainMod SHIFT CTRL, down,  movewindow, d

# Resize with the keyboard (minus/equal keys)
bind = $mainMod, minus,        resizeactive, -100 0
bind = $mainMod, equal,        resizeactive,  100 0
bind = $mainMod SHIFT, minus,  resizeactive, 0 -100
bind = $mainMod SHIFT, equal,  resizeactive, 0  100
bind = $mainMod ALT, minus,        resizeactive, -25 0
bind = $mainMod ALT, equal,        resizeactive,  25 0
bind = $mainMod SHIFT ALT, minus,  resizeactive, 0 -25
bind = $mainMod SHIFT ALT, equal,  resizeactive, 0  25
bind = $mainMod CTRL, minus,        resizeactive, -300 0
bind = $mainMod CTRL, equal,        resizeactive,  300 0
bind = $mainMod SHIFT CTRL, minus,  resizeactive, 0 -300
bind = $mainMod SHIFT CTRL, equal,  resizeactive, 0  300

# Resize/move with the mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Scratchpad (true Hyprland special workspace)
bind = $mainMod, S,      togglespecialworkspace, scratchpad
bind = $mainMod ALT, S,  movetoworkspacesilent, special:scratchpad

# Quake-style console. Omarchy launched a dedicated terminal here; with plain
# Hyprland this is an empty special workspace — put your own terminal in it
# once with SUPER+SHIFT+grave.
bind = $mainMod, grave,        togglespecialworkspace, qconsole
bind = $mainMod SHIFT, grave,  movetoworkspacesilent, special:qconsole

# Minimize. Hyprland has no native minimize; Omarchy's version needed its dock.
# This sends the window to a hidden special workspace instead:
#   SUPER+M         hide the active window
#   SUPER+SHIFT+M   show/hide all hidden windows
# NOTE: unlike Omarchy, windows are not restored individually from a dock.
bind = $mainMod, M,        movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, M,  togglespecialworkspace, minimized

# =============================================================================
#  WORKSPACES
# =============================================================================
# Stock Hyprland workspaces are global. Omarchy had independent 1-10 sets per
# monitor. If you want that back, add workspace rules in hyprland.conf, e.g.
#   workspace = 1, monitor:DP-1
#   workspace = 2, monitor:DP-1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# "Silent" = send without following.
bind = $mainMod SHIFT ALT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT ALT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT ALT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT ALT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT ALT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT ALT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT ALT, 0, movetoworkspacesilent, 10

bind = $mainMod, TAB,          workspace, m+1
bind = $mainMod SHIFT, TAB,    workspace, m-1
bind = $mainMod CTRL, TAB,     workspace, previous

# Scroll to change workspace (Omarchy used SUPER + mouse wheel)
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up,   workspace, m-1

# =============================================================================
#  APPLICATIONS
# =============================================================================

bind = $mainMod, Return,        exec, $terminal
bind = $mainMod SHIFT, Return,  exec, $browser
bind = $mainMod SHIFT, B,       exec, $browser
bind = $mainMod SHIFT ALT, B,   exec, $browser --private
# Omarchy opened Nautilus at the focused terminal's cwd via a helper; plain
# nautilus opens your home directory.
bind = $mainMod SHIFT, F,       exec, $fileManager
bind = $mainMod SHIFT ALT, F,   exec, $fileManager
bind = $mainMod SHIFT, N,       exec, $editor

# Launcher (Omarchy menu -> fuzzel's drun mode)
bind = $mainMod, space,      exec, $menu
bind = $mainMod ALT, space,  exec, $menu

# Toggle the Waybar (Omarchy used quickshell's bar). SIGUSR1 toggles visibility.
bind = $mainMod SHIFT, space, exec, pkill -USR1 waybar

# =============================================================================
#  MEDIA / SYSTEM
# =============================================================================

# Volume (wireplumber / PipeWire). -l 1.0 caps at 100%.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ALT, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+
bindel = ALT, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# Brightness (brightnessctl; needs the video group or a udev rule)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = ALT, XF86MonBrightnessUp,   exec, brightnessctl set 1%+
bindel = ALT, XF86MonBrightnessDown, exec, brightnessctl set 1%-
bind = SHIFT, XF86MonBrightnessUp,   exec, brightnessctl set 100%
bind = SHIFT, XF86MonBrightnessDown, exec, brightnessctl set 1%

# Media transport (playerctl + any MPRIS player: mpv, Firefox, Spotify, ...)
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86Eject,      exec, eject

# Screenshots: region -> annotate in satty (copy/save from its UI)
bind = , PRINT,                 exec, $scripts/screenshot.sh
bind = $mainMod CTRL ALT, C,    exec, $scripts/screenshot.sh
# Color picker (copies the hex value)
bind = $mainMod, PRINT,         exec, hyprpicker -a

# Clipboard history (cliphist + fuzzel). Requires wl-paste watcher, see README.
bind = $mainMod CTRL, V,        exec, $scripts/clipboard.sh

# Lock (hyprlock)
bind = $mainMod CTRL, L,        exec, hyprlock
# Power key: lock instead of Omarchy's power menu. Replace with wlogout if wanted.
bindl = , XF86PowerOff,         exec, hyprlock

# Notifications (mako)
bind = $mainMod, comma,          exec, makoctl restore
bind = $mainMod SHIFT, comma,    exec, makoctl dismiss --all
bind = $mainMod ALT, comma,      exec, makoctl dismiss

# =============================================================================
#  OMARCHY-ONLY BINDINGS NOT PORTED
# =============================================================================
#  These had no standard Hyprland equivalent and were intentionally dropped:
#
#   SUPER+ESC / SUPER+CTRL+{A,B,D,N,P,...}  quickshell menu + hardware panels
#   SUPER+CTRL+{1..9}                       bar panel shortcuts
#   SUPER+SHIFT+{A,C,E,...}                 preinstalled web apps / email
#   SUPER+SHIFT+{M,G,O,W,X,Y,...}           Spotify, Signal, Obsidian, X, ...
#   SUPER+ALT+RETURN / SUPER+CTRL+RETURN    Omarchy tmux/herdr terminals
#   SUPER+CTRL+E                            emoji panel
#   SUPER+CTRL+{R,ALT+R,SHIFT+CTRL+R}       reminders
#   SUPER+CTRL+ALT+{T,B,W}                  time / battery / weather toasts
#   SUPER+L / SUPER+ALT+L                   Omarchy workspace-layout cycle
#   SUPER+SLASH / SUPER+ALT+SLASH           monitor scaling helper
#   SUPER+CTRL+DELETE                       laptop display toggle
#   SUPER+BACKSPACE / SHIFT+BACKSPACE       transparency / gaps toggles
#   SUPER+CTRL+ALT+F                        fullscreen-desktop toggle
#   SUPER+I / SUPER+SHIFT+I                 input-method (fcitx5) switching
#   ALT+SPACE / ALT+Alt_R                   dictation
#   SUPER+CTRL+{Z,ALT+Z}                    cursor zoom
#   SUPER+CTRL+S / SUPER+CTRL+PERIOD        share / transcode
#   SUPER+ALT+{Home,code:34/35}             width save, webcam overlay resize
#   SUPER+CTRL+{Print,C}                    OCR screenshot
#   ALT+PRINT                               screen recording (wf-recorder)
#   XF86Touchpad*                           touchpad toggles
#
#  The omarchy-* helper package is NOT required by this file.
